# ==============================================================================
# Railway Configuration for Promise
# ==============================================================================
# Target: Railway Managed Infrastructure
#
# Services attached to this repo in Railway:
#
# 1. promise-web:
#    Start Command: (Leave empty — Dockerfile CMD runs Daphne)
#    Healthcheck:   Set in Railway dashboard ONLY:
#                     Settings → Deploy → Healthcheck Path: /api/v1/health/ready/
#                   DO NOT set healthcheckPath here — it would apply to all services.
#
# 2. promise-background-worker:
#    Start Command: python scripts/run_background_workers.py
#    Healthcheck:   NONE (background process, no HTTP server)
#
# 3. promise-goal-worker:
#    Start Command: python manage.py consume_goal_events
#    Healthcheck:   NONE (Kafka consumer, no HTTP server)
#
# Managed Services (private network only):
# - Railway PostgreSQL  → postgres.railway.internal
# - Railway Redis       → redis.railway.internal
#
# External Messaging:
# - Aiven Managed Kafka (SASL_SSL / SCRAM-SHA-256)
# ==============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
# healthcheckPath is intentionally absent.
# Railway applies railway.toml to EVERY service attached to this repo.
# Worker services (background-worker, goal-worker) run no HTTP server.
# Configure the healthcheck for promise-web in the Railway dashboard instead:
#   Settings → Deploy → Healthcheck Path: /api/v1/health/ready/
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

