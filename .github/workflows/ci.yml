name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests & Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: promise
          POSTGRES_USER: promise
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio fakeredis[lua]

      - name: Check Django Configuration
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key-12345678901234567890123456789012
          DATABASE_URL: postgresql://promise:changeme@localhost:5432/promise
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: python manage.py check

      - name: Check Pending Migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key-12345678901234567890123456789012
          DATABASE_URL: postgresql://promise:changeme@localhost:5432/promise
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: python manage.py makemigrations --check

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: test-secret-key-12345678901234567890123456789012
          DATABASE_URL: postgresql://promise:changeme@localhost:5432/promise
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest -v

  android:
    name: Android Unit Tests & Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew test

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
