org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Physical-device debug API URL (optional). Prefer android/local.properties so the
# LAN IP is not committed. Example in local.properties:
# promise.apiBaseUrl=http://192.168.1.10:8000/api/v1/
# Or pass -Ppromise.apiBaseUrl=... on the Gradle command line.
# Default when unset: http://10.0.2.2:8000/api/v1/ (emulator).
