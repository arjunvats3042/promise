[project]
name = "promise-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django~=6.1.0",
    "djangorestframework",
    "django-environ",
    "psycopg[binary]",
    "PyJWT>=2.8",
    "argon2-cffi",
    "cryptography",
    "redis",
    "confluent-kafka",
    "channels>=4.1.0",
    "daphne>=4.1.0",
    "channels_redis>=4.2.0",
    "firebase-admin>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-asyncio",
    "fakeredis[lua]",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
testpaths = ["tests"]
