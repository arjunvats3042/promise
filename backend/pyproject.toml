[project]
name = "promise-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django~=6.1.0",
    "djangorestframework",
    "django-environ",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
testpaths = ["tests"]
